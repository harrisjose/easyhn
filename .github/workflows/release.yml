name: Release

# Build the Chrome + Firefox packages and attach them to a GitHub Release.
# Tag a version to publish, e.g. `git tag v0.1.0 && git push --tags`.
# Runs on manual dispatch too, uploading the zips as workflow artifacts only.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build & zip (Chrome + Firefox)
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyhn-extension
          path: .output/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: .output/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
