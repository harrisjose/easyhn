<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>easyhn — store screenshot lab</title>
<style>
  /* Renders one Chrome/Firefox store screenshot (1280x800) per ?shot=N.
     Frameless: the product fills the canvas edge-to-edge, no cards, no
     captions — words live in the listing text, not baked into pixels.
     Sources are full-page captures of the current build; shots whose
     capture hasn't been taken yet render a labelled placeholder instead
     of silently shipping something stale.
     Regenerate: see store/README.md. */
  :root {
    --paper: #faf9f7;
    --ink-faint: #707278;
    --hairline: rgba(0, 0, 0, 0.09);
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("../landing/public/fonts/jetbrains-mono-400.woff2") format("woff2");
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1280px; height: 800px;
    overflow: hidden;
    background: var(--paper);
  }

  .shot { width: 1280px; height: 800px; display: none; }
  .shot.on { display: block; }
  .pending.on { display: grid; }
  .shot img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  /* The theme shot: two full-page captures, one per theme, meeting along a
     diagonal. Both render at normal product scale and share the same left
     anchor so story rows stay aligned across the split. */
  .split { position: relative; }
  .split .pane {
    position: absolute; inset: 0;
    background-repeat: no-repeat;
    background-size: auto 800px;
    background-position: left top;
  }
  .split .pane--a { clip-path: polygon(0 0, 55% 0, 45% 100%, 0 100%); }
  .split .pane--b { clip-path: polygon(55% 0, 100% 0, 100% 100%, 45% 100%); }

  /* Placeholder for a shot whose capture is still owed. */
  .pending {
    display: grid;
    place-items: center;
  }
  .pending span {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ink-faint);
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    padding: 12px 24px;
  }
</style>
</head>
<body>
  <div class="shot" id="shot">
    <img id="img" alt="" />
  </div>
  <div class="shot split" id="split">
    <div class="pane pane--a"></div>
    <div class="pane pane--b"></div>
  </div>
  <div class="shot pending" id="pending"><span></span></div>

<script>
  /* Upload order. Every source is a full-bleed capture of the live build;
     when a file is missing the slot renders the placeholder rather than an
     outdated substitute. */
  const SHOTS = {
    0: { img: "raw/captures/front-light.png" },
    1: { light: "raw/theme-light.jpg", dark: "raw/theme-dark.jpg" },
    2: { img: "raw/captures/thread-dark.png" },
    3: { img: "raw/captures/keyboard-light.png",
         todo: "keyboard navigation — full-page capture, list focused on a row" },
    4: { img: "raw/captures/settings-light.png",
         todo: "settings panel — full-page capture, panel open" },
  };

  const n = new URLSearchParams(location.search).get("shot") || "0";
  const s = SHOTS[n];
  const on = (id) => document.getElementById(id).classList.add("on");

  if (s.light) {
    document.querySelector("#split .pane--a")
      .style.backgroundImage = `url(${s.light})`;
    document.querySelector("#split .pane--b")
      .style.backgroundImage = `url(${s.dark})`;
    on("split");
  } else {
    const img = document.getElementById("img");
    img.addEventListener("load", () => on("shot"));
    img.addEventListener("error", () => {
      document.querySelector("#pending span").textContent =
        `capture pending — ${s.todo || s.img}`;
      on("pending");
    });
    img.src = s.img;
  }
</script>
</body>
</html>
